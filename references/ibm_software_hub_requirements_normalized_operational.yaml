document:
  title: IBM Software Hub 5.3.x software requirements
  source:
    url: https://www.ibm.com/docs/en/software-hub/5.3.x?topic=requirements-software
  normalization_policy:
    goal: cleaned_consistent_operational_yaml
    naming_policy: Conservative standardization. Service names are normalized for consistency, but potentially distinct IBM services are not merged unless the source itself is explicit.
    dependency_shape: typed_objects_option_b
    schema_validated: true
platform:
  required_software:
  - name: Red Hat OpenShift Container Platform
    supported_versions:
    - version: 4.14.0 or later fixes
      documentation_urls:
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      cluster_sizing_architectures:
      - x86_64
      - ppc64le
      - s390x
    - version: 4.16.4 or later fixes
      documentation_urls:
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      cluster_sizing_architectures:
      - x86_64
      - ppc64le
      - s390x
    - version: 4.17.0 or later fixes
      documentation_urls:
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      cluster_sizing_architectures:
      - x86_64
      - ppc64le
      - s390x
    - version: 4.18.6 or later fixes
      documentation_urls:
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      cluster_sizing_architectures:
      - x86_64
      - ppc64le
      - s390x
    - version: 4.19.0 or later fixes
      documentation_urls:
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      cluster_sizing_architectures:
      - x86_64
      - ppc64le
      - s390x
    - version: 4.20.0 or later fixes
      documentation_urls:
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      - https://docs.redhat.com/
      cluster_sizing_architectures:
      - x86_64
      - ppc64le
      - s390x
    restrictions:
    - Do not install the KubeVirt HyperConverged Cluster Operator from the Community Operator catalog source on the cluster.
    references:
    - name: Licenses and entitlements
      url: https://www.ibm.com/docs/en/software-hub/5.3.x?topic=requirements-licenses-entitlements
  - name: Red Hat OpenShift Container Platform cert-manager Operator
    installed_by_default: false
    required_when: cert-manager Operator is needed on the cluster
    references:
    - name: Version 4.14 documentation
      url: https://docs.redhat.com/
    - name: Version 4.16 documentation
      url: https://docs.redhat.com/
    - name: Version 4.17 documentation
      url: https://docs.redhat.com/
    - name: Version 4.18 documentation
      url: https://docs.redhat.com/
    - name: Version 4.19 documentation
      url: https://docs.redhat.com/
    - name: Version 4.20 documentation
      url: https://docs.redhat.com/
  - name: Kubernetes Metrics Server
    required_when: default monitoring stack is disabled and pod/node usage metrics are needed
    references:
    - name: Kubernetes Metrics Server
      url: https://github.com/kubernetes-sigs/metrics-server
    notes:
    - If neither the default monitoring stack nor Kubernetes Metrics Server is present, platform monitoring features in IBM Software Hub do not work.
  supported_networking_protocols:
  - IPv4 single-stack network
  - IPv4/IPv6 dual-stack network
  shared_cluster_components_without_additional_software_requirements:
  - Scheduling service
  - IBM License Service
external_dependency_catalog:
  items:
  - name: Node Feature Discovery Operator
    type: operator
    version_selection_rule: Depends on the Red Hat OpenShift Container Platform version in use.
    required_version_channel: stable
    references:
    - name: OpenShift Operator Life Cycles
      url: https://access.redhat.com/support/policy/updates/openshift
  - name: NVIDIA GPU Operator
    type: operator
    version_selection_rule: Depends on the Red Hat OpenShift Container Platform version in use.
    required_version_channel: generally available
    references:
    - name: NVIDIA GPU Operator Life Cycle
      url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/platform-support.html
    - name: OpenShift Operator Life Cycles
      url: https://access.redhat.com/support/policy/updates/openshift
  - name: Red Hat OpenShift AI
    type: platform_software
    version_matrix:
    - ibm_software_hub_release: 5.3.1
      release_date: February 2026
      required_version: 2.25.1
    - ibm_software_hub_release: 5.3.0
      release_date: December 2025
      required_version: '2.25'
  - name: Multicloud Object Gateway
    type: platform_software
    version_selection_rule: Depends on the Red Hat OpenShift Container Platform version in use.
  - name: Red Hat OpenShift Serverless Knative Eventing
    type: platform_software
    version_selection_rule: Depends on the Red Hat OpenShift Container Platform version in use.
    references:
    - name: OpenShift Operator Life Cycles
      url: https://access.redhat.com/support/policy/updates/openshift
